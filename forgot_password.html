<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Whodis - รีเซ็ตรหัสผ่านด้วย OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        "base-bg": "#f8fafc",
                        "card-bg": "#ffffff",
                        "primary-text": "#0f172a",
                        "muted-text": "#64748b",
                        "danger": "#ef4444",
                        "success": "#10b981",
                        "warning": "#facc15",
                        "dark-badge": "#1e293b"
                    },
                    fontFamily: { "sans": ["Inter", "Noto Sans Thai", "sans-serif"] }
                } 
            } 
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <style>
        .nav-link {
            padding: 0.5rem 1rem;
            font-size: 14px;
            font-weight: 500;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .nav-link.active {
            background-color: #1e293b;
            color: #ffffff;
        }
        .btn-green-solid {
            background-color: #10b981;
            color: #ffffff;
            padding: 0.5rem 1.4rem;
            font-size: 14px;
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.2s ease;
            display: inline-block;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .btn-green-solid:hover {
            background-color: #059669;
        }
    </style>
</head>
<body class="font-sans text-primary-text bg-base-bg antialiased min-h-screen flex flex-col">
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="w-full pt-16 pb-24 bg-base-bg flex-1 flex items-center justify-center">
        <div class="max-w-[460px] w-full mx-auto px-4">
            
            <!-- หัวข้อหน้า Forgot Password -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-gray-100 text-primary-text rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-sm border border-gray-200">
                    <span class="material-symbols-outlined text-[24px]">lock_reset</span>
                </div>
                <h1 class="text-[28px] font-bold text-primary-text mb-2">รีเซ็ตรหัสผ่าน</h1>
                <p class="text-muted-text text-[14px]">ยืนยันตัวตนด้วยรหัส OTP ผ่านทางอีเมลของคุณ</p>
            </div>

            <!-- กล่องฟอร์ม -->
            <div class="bg-white border border-gray-200 rounded-3xl p-8 shadow-sm">
                
                <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-[14px] flex items-center gap-2"></div>

                <!-- ขั้นตอนที่ 1: กรอกอีเมลเพื่อรับ OTP -->
                <div id="step-request-otp">
                    <form onsubmit="handleRequestOtp(event)" class="space-y-4">
                        <div>
                            <label class="block text-[13px] font-semibold text-primary-text mb-1.5">อีเมลที่ลงทะเบียนไว้</label>
                            <input id="req-email" type="email" required class="w-full h-[48px] px-4 bg-gray-50 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="name@example.com">
                            <p class="text-[12px] text-muted-text mt-1.5 flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">mail</span> ระบบจะส่งรหัส OTP 6 หลักไปยังอีเมลนี้
                            </p>
                        </div>

                        <button id="requestOtpBtn" type="submit" class="w-full h-[50px] bg-primary-text hover:bg-gray-800 text-white text-[15px] font-bold rounded-xl shadow-md transition-transform hover:scale-[1.01] flex items-center justify-center gap-2 mt-4">
                            ส่งรหัส OTP <span class="material-symbols-outlined text-[18px]">send</span>
                        </button>
                    </form>
                </div>

                <!-- ขั้นตอนที่ 2: กรอกรหัส OTP และตั้งรหัสผ่านใหม่ -->
                <div id="step-verify-otp" class="hidden">
                    <div class="mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-800 rounded-xl text-xs flex items-center justify-between">
                        <span>ส่งรหัสไปที่: <strong id="target-email-display"></strong></span>
                        <button onclick="backToStep1()" class="text-blue-600 hover:underline font-semibold">เปลี่ยนอีเมล</button>
                    </div>

                    <form onsubmit="handleResetPassword(event)" class="space-y-4">
                        <div>
                            <label class="block text-[13px] font-semibold text-primary-text mb-1.5">รหัส OTP 6 หลัก</label>
                            <input id="input-otp" type="text" maxlength="6" pattern="[0-9]{6}" required class="w-full h-[52px] px-4 text-center tracking-[8px] font-mono text-[24px] font-bold bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="••••••">
                            <p class="text-[11px] text-muted-text mt-1 text-center">รหัสมีอายุการใช้งาน 10 นาที</p>
                        </div>

                        <div>
                            <label class="block text-[13px] font-semibold text-primary-text mb-1.5">รหัสผ่านใหม่</label>
                            <input id="input-new-password" type="password" required minlength="6" class="w-full h-[46px] px-4 bg-gray-50 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="ตั้งรหัสผ่านใหม่อย่างน้อย 6 ตัวอักษร">
                        </div>

                        <div>
                            <label class="block text-[13px] font-semibold text-primary-text mb-1.5">ยืนยันรหัสผ่านใหม่อีกครั้ง</label>
                            <input id="input-confirm-password" type="password" required minlength="6" class="w-full h-[46px] px-4 bg-gray-50 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง">
                        </div>

                        <button id="resetPassBtn" type="submit" class="w-full h-[50px] bg-emerald-600 hover:bg-emerald-700 text-white text-[15px] font-bold rounded-xl shadow-md transition-transform hover:scale-[1.01] flex items-center justify-center gap-2 mt-4">
                            บันทึกรหัสผ่านใหม่ <span class="material-symbols-outlined text-[18px]">check_circle</span>
                        </button>
                    </form>
                </div>

                <div class="mt-8 text-center pt-6 border-t border-gray-100">
                    <p class="text-[14px] text-muted-text">
                        จำรหัสผ่านได้แล้ว? <a href="login.html" class="font-bold text-primary-text hover:underline">กลับไปเข้าสู่ระบบ</a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <footer class="w-full pb-8 pt-4 border-t border-gray-200 mt-auto">
        <div class="max-w-[1000px] mx-auto px-4 text-center">
            <div class="flex items-center justify-center gap-1 mb-2">
                <span class="material-symbols-outlined text-[16px] text-primary-text">verified_user</span>
                <span class="font-bold text-[14px] text-primary-text">Whodis</span>
            </div>
            <p class="text-[12px] text-muted-text">Check Before You Pay — เช็กก่อนโอนทุกครั้ง ป้องกันดีกว่าแก้</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script>
        let currentEmail = '';

        async function handleRequestOtp(e) {
            e.preventDefault();
            const emailInput = document.getElementById('req-email');
            const btn = document.getElementById('requestOtpBtn');
            const email = emailInput.value.trim().toLowerCase();

            btn.disabled = true;
            btn.innerHTML = `กำลังส่ง OTP... <span class="material-symbols-outlined animate-spin text-[18px]">sync</span>`;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    currentEmail = email;
                    document.getElementById('target-email-display').textContent = email;
                    document.getElementById('step-request-otp').classList.add('hidden');
                    document.getElementById('step-verify-otp').classList.remove('hidden');

                    let extraInfo = '';
                    if (data.devOtp) {
                        extraInfo = ` <span class="text-xs text-gray-500 font-mono">(รหัสทดสอบ: ${data.devOtp})</span>`;
                    }
                    showAlert(`ส่งรหัส OTP ไปยัง ${email} เรียบร้อยแล้ว${extraInfo}`, 'success');
                } else {
                    showAlert(data.message || 'ไม่พบบัญชีผู้ใช้นี้ในระบบ', 'error');
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `ส่งรหัส OTP <span class="material-symbols-outlined text-[18px]">send</span>`;
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const otp = document.getElementById('input-otp').value.trim();
            const newPassword = document.getElementById('input-new-password').value;
            const confirmPassword = document.getElementById('input-confirm-password').value;
            const btn = document.getElementById('resetPassBtn');

            if (newPassword !== confirmPassword) {
                showAlert('รหัสผ่านใหม่และการยืนยันรหัสผ่านไม่ตรงกัน', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('รหัสผ่านใหม่ต้องมีความยาวอย่างน้อย 6 ตัวอักษร', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `กำลังบันทึก... <span class="material-symbols-outlined animate-spin text-[18px]">sync</span>`;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        otp: otp,
                        newPassword: newPassword
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'รหัส OTP ไม่ถูกต้องหรือหมดอายุ', 'error');
                }
            } catch (err) {
                showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `บันทึกรหัสผ่านใหม่ <span class="material-symbols-outlined text-[18px]">check_circle</span>`;
            }
        }

        function backToStep1() {
            document.getElementById('step-verify-otp').classList.add('hidden');
            document.getElementById('step-request-otp').classList.remove('hidden');
            document.getElementById('alert-box').classList.add('hidden');
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.remove('hidden');
            if (type === 'success') {
                alertBox.className = 'mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-[14px] flex items-center gap-2';
                alertBox.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span> <div>${msg}</div>`;
            } else {
                alertBox.className = 'mb-6 p-4 bg-red-50 border border-red-200 text-danger rounded-xl text-[14px] flex items-center gap-2';
                alertBox.innerHTML = `<span class="material-symbols-outlined text-[20px]">error</span> <div>${msg}</div>`;
            }
        }
    </script>
</body>
</html>
