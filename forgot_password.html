<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Whodis - รีเซ็ตรหัสผ่านด้วย OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        "base-bg": "#f8fafc",
                        "card-bg": "#ffffff",
                        "primary-text": "#0f172a",
                        "muted-text": "#64748b",
                        "danger": "#ef4444",
                        "success": "#10b981",
                        "warning": "#facc15",
                        "dark-badge": "#1e293b"
                    },
                    fontFamily: { "sans": ["Inter", "Noto Sans Thai", "sans-serif"] }
                } 
            } 
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <style>
        .nav-link {
            padding: 0.5rem 1rem;
            font-size: 14px;
            font-weight: 500;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .nav-link.active {
            background-color: #1e293b;
            color: #ffffff;
        }
        .btn-green-solid {
            background-color: #10b981;
            color: #ffffff;
            padding: 0.5rem 1.4rem;
            font-size: 14px;
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.2s ease;
            display: inline-block;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .btn-green-solid:hover {
            background-color: #059669;
        }
    </style>
</head>
<body class="font-sans text-primary-text bg-base-bg antialiased min-h-screen flex flex-col">
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="w-full pt-16 pb-24 bg-base-bg flex-1 flex items-center justify-center">
        <div class="max-w-[460px] w-full mx-auto px-4">
            
            <!-- หัวข้อหน้า Reset Password -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-gray-100 text-primary-text rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-sm border border-gray-200">
                    <span class="material-symbols-outlined text-[24px]">lock_reset</span>
                </div>
                <h1 class="text-[28px] font-bold text-primary-text mb-2">ตั้งรหัสผ่านใหม่</h1>
                <p class="text-muted-text text-[14px]">แก้ไขรหัสผ่านของคุณได้ทันที ไม่ต้องใช้รหัส OTP</p>
            </div>

            <!-- กล่องฟอร์ม -->
            <div class="bg-white border border-gray-200 rounded-3xl p-8 shadow-sm">
                
                <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-[14px] flex items-center gap-2"></div>

                <form onsubmit="handleDirectReset(event)" class="space-y-4">
                    <div>
                        <label class="block text-[13px] font-semibold text-primary-text mb-1.5">
                            อีเมลที่ลงทะเบียนไว้ <span class="text-red-500">*</span>
                        </label>
                        <input id="reset-email" type="email" required class="w-full h-[48px] px-4 bg-gray-50 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="name@example.com">
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-[13px] font-semibold text-primary-text">
                                ชื่อผู้ใช้ (Username)
                            </label>
                            <span class="text-[11px] text-muted-text">ไม่บังคับ</span>
                        </div>
                        <input id="reset-username" type="text" class="w-full h-[48px] px-4 bg-gray-50 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="ระบุชื่อผู้ใช้ของคุณ (หากจำได้)">
                        <p class="text-[11px] text-muted-text mt-1">💡 หากจำชื่อผู้ใช้ไม่ได้ สามารถเว้นว่างไว้ได้</p>
                    </div>

                    <div>
                        <label class="block text-[13px] font-semibold text-primary-text mb-1.5">
                            รหัสผ่านใหม่ <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input id="reset-new-password" type="password" required minlength="6" class="w-full h-[48px] px-4 pr-11 bg-gray-50 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="ตั้งรหัสผ่านใหม่อย่างน้อย 6 ตัวอักษร">
                            <button type="button" onclick="togglePass('reset-new-password', 'eye-new')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <span id="eye-new" class="material-symbols-outlined text-[20px]">visibility</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[13px] font-semibold text-primary-text mb-1.5">
                            ยืนยันรหัสผ่านใหม่อีกครั้ง <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input id="reset-confirm-password" type="password" required minlength="6" class="w-full h-[48px] px-4 pr-11 bg-gray-50 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:border-primary-text focus:bg-white transition-colors" placeholder="กรอกรหัสผ่านใหม่อีกครั้งให้ตรงกัน">
                            <button type="button" onclick="togglePass('reset-confirm-password', 'eye-confirm')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <span id="eye-confirm" class="material-symbols-outlined text-[20px]">visibility</span>
                            </button>
                        </div>
                    </div>

                    <button id="submitResetBtn" type="submit" class="w-full h-[50px] bg-primary-text hover:bg-gray-800 text-white text-[15px] font-bold rounded-xl shadow-md transition-transform hover:scale-[1.01] flex items-center justify-center gap-2 mt-4">
                        บันทึกรหัสผ่านใหม่ทันที <span class="material-symbols-outlined text-[18px]">check_circle</span>
                    </button>
                </form>

                <div class="mt-8 text-center pt-6 border-t border-gray-100">
                    <p class="text-[14px] text-muted-text">
                        จำรหัสผ่านได้แล้ว? <a href="login.html" class="font-bold text-primary-text hover:underline">กลับไปเข้าสู่ระบบ</a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <footer class="w-full pb-8 pt-4 border-t border-gray-200 mt-auto">
        <div class="max-w-[1000px] mx-auto px-4 text-center">
            <div class="flex items-center justify-center gap-1 mb-2">
                <span class="material-symbols-outlined text-[16px] text-primary-text">verified_user</span>
                <span class="font-bold text-[14px] text-primary-text">Whodis</span>
            </div>
            <p class="text-[12px] text-muted-text">Check Before You Pay — เช็กก่อนโอนทุกครั้ง ป้องกันดีกว่าแก้</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script>
        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        async function handleDirectReset(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value.trim().toLowerCase();
            const username = document.getElementById('reset-username').value.trim();
            const newPassword = document.getElementById('reset-new-password').value;
            const confirmPassword = document.getElementById('reset-confirm-password').value;
            const btn = document.getElementById('submitResetBtn');

            if (newPassword !== confirmPassword) {
                showAlert('รหัสผ่านใหม่และการยืนยันรหัสผ่านไม่ตรงกัน', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('รหัสผ่านใหม่ต้องมีความยาวอย่างน้อย 6 ตัวอักษร', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `กำลังบันทึกรหัสผ่านใหม่... <span class="material-symbols-outlined animate-spin text-[18px]">sync</span>`;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        username: username,
                        newPassword: newPassword
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1800);
                } else {
                    showAlert(data.message || 'ไม่สามารถเปลี่ยนรหัสผ่านได้ กรุณาลองใหม่อีกครั้ง', 'error');
                }
            } catch (err) {
                showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์ กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `บันทึกรหัสผ่านใหม่ทันที <span class="material-symbols-outlined text-[18px]">check_circle</span>`;
            }
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.remove('hidden');
            if (type === 'success') {
                alertBox.className = 'mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-[14px] flex items-center gap-2';
                alertBox.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span> <div>${msg}</div>`;
            } else {
                alertBox.className = 'mb-6 p-4 bg-red-50 border border-red-200 text-danger rounded-xl text-[14px] flex items-center gap-2';
                alertBox.innerHTML = `<span class="material-symbols-outlined text-[20px]">error</span> <div>${msg}</div>`;
            }
        }
    </script>
</body>
</html>
